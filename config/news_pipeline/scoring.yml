  [回购, 增持, 减持, 目标价, 评级, 首次覆盖, 财报, 业绩, 营收, 净利, 指引, 预增, 预减, 预亏, 扭亏, 快报, 预告,
   收购, 并购, 重组, 分拆, 要约, 私有化, 定增, 配股, 可转债, 中标, 召回, 调查, 处罚, 罚款, 诉讼, 起诉, 禁令,
