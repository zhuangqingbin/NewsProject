amount_events:      # 同上，且标题句里要有金额
  [投资, 融资, 发债, 发行]

roundup_words:      # 命中即视为行情播报
  [要闻, 一览, 速递, 早知道, 早报, 晚报, 收评, 午评, 开盘, 收盘, 盘中, 异动, 概念, 板块, 普涨, 普跌, 跟涨, 跟跌,
