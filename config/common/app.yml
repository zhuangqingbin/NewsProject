# Legacy settings remain until v2 has passed the one-week stability gate.
# LLM stays disabled until model selection and real console prices are configured.
runtime:
  timezone_display:
    us: America/New_York
    cn: Asia/Shanghai
  hot_reload: true
  daily_cost_ceiling_cny: 5.0
scheduler:
  scrape:
    market_hours_interval_sec: 180
    off_hours_interval_sec: 1800
    caixin_interval_sec: 60
  llm:
    process_interval_sec: 120
  digest:
    morning_cn: 08:30
    evening_cn: '21:00'
    morning_us: '21:00'
    evening_us: 04:30
    cn:
    - at: 08:27
      tz: Asia/Shanghai
    - at: '20:57'
      tz: Asia/Shanghai
    us:
    - at: 08:27
      tz: America/New_York
    - at: '16:27'
      tz: America/New_York
llm:
  tier0_model: deepseek-v3
  tier1_model: deepseek-v3
  tier2_model: claude-haiku-4-5-20251001
  tier3_model: claude-sonnet-4-6
  prompt_versions:
    tier0_classify: v1
    tier1_summarize: v1
    tier2_extract: v1
    tier3_deep_analysis: v1
  enable_prompt_cache: true
  enable_batch: true
  enabled: false
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  assess:
    model: qwen-plus
    max_tokens: 400
    prompt_version: assess_v1
  digest:
    model: qwen-plus
    max_tokens: 1500
    prompt_version: digest_v1
  daily_cost_ceiling_cny: 5.0
  pricing: {}
classifier:
  rules:
    price_move_critical_pct: 5.0
    sources_always_critical:
    - sec_edgar
    - juchao
    sentiment_high_magnitude_critical: true
  llm_fallback_when_score:
  - 40
  - 70
dedup:
  url_strict: true
  title_simhash_distance: 4
charts:
  auto_on_critical: true
  auto_on_earnings: true
  cache_ttl_days: 30
push:
  per_channel_rate: 30/min
  same_ticker_burst_window_min: 5
  same_ticker_burst_threshold: 3
  digest_max_items_per_section: 30
  max_age_min: 90
  dedup_window_hours: 6
  quiet_hours:
    enabled: false
    start: 00:30
    end: 07:30
    tz: Asia/Shanghai
    allow_reasons:
    - big_move
    - tier:high
  color_scheme: us
  push_min_materiality: 4
  push_min_materiality_macro: 5
  digest_min_materiality: 3
  min_confidence: 0.5
  quiet_min_materiality: 5
  first_party_floor:
    tier:high: 4
    tier:normal: 3
dead_letter:
  auto_retry_kinds:
  - scrape
  - push_5xx
  - llm_timeout
  notify_only_kinds:
  - push_4xx
  - llm_validation
  weekly_summary_day: monday
retention:
  raw_news_hot_days: 30
  news_processed_hot_days: 365
  push_log_days: 90
pipeline:
  mode: legacy
digest:
  max_items: 20
  max_age_hours: 24
ops:
  report_at: 08:20
  report_channel: feishu_cn
