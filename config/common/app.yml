# Staged v0.7.1 configuration; rollout gates still apply.
# LLM stays disabled until reviewed models and console prices are configured.
scheduler:
  digest:
    cn:
    - at: 08:27
      tz: Asia/Shanghai
    - at: '20:57'
      tz: Asia/Shanghai
    us:
    - at: 08:27
      tz: America/New_York
    - at: '16:27'
      tz: America/New_York
llm:
  enabled: false
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  assess:
    model: qwen-plus
    max_tokens: 400
    prompt_version: assess_v1
  digest:
    model: qwen-plus
    max_tokens: 1500
    prompt_version: digest_v1
  daily_cost_ceiling_cny: 5.0
  pricing: {}
push:
  same_ticker_burst_window_min: 5
  same_ticker_burst_threshold: 3
  max_age_min: 90
  quiet_hours:
    enabled: false
    start: 00:30
    end: 07:30
    tz: Asia/Shanghai
    allow_reasons:
    - big_move
    - tier:high
  color_scheme: us
  push_min_materiality: 4
  push_min_materiality_macro: 5
  digest_min_materiality: 3
  min_confidence: 0.5
  quiet_min_materiality: 5
  first_party_floor:
    tier:high: 4
    tier:normal: 3
pipeline:
  mode: v2
digest:
  max_items: 20
  max_age_hours: 24
ops:
  report_at: 08:20
  report_channel: feishu_cn
